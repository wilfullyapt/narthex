[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "narthex"
version = "0.4.0"
description = "LAN voice doorway appliance: Magic Mirror–class glass + wake word to Hermes (Portunus)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Narthex contributors" }]
keywords = ["hermes", "voice", "raspberry-pi", "magic-mirror", "kiosk", "wake-word"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "httpx>=0.27.0",
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
  "pyyaml>=6.0",
  "websockets>=13.0",
  "cryptography>=42.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.8.0",
]
# Heavy edge deps installed on device as needed — not required for unit smoke.
audio = [
  "numpy>=1.26",
  "openwakeword>=0.6.0",
  "faster-whisper>=1.0.0",
  "sounddevice>=0.4.6",
  "torch>=2.0",  # silero vad via torch.hub
  # optional: pyaudio if sounddevice unavailable on the host
  # piper TTS: install separately (binary) — see docs/tts.md
]
identity = [
  # voxmetrica path when wired
]

[project.scripts]
narthex = "narthex.cli:main"
narthexd = "narthex.daemon:main"

[project.urls]
Homepage = "https://github.com/wilfullyapt/narthex"
Repository = "https://github.com/wilfullyapt/narthex"
Issues = "https://github.com/wilfullyapt/narthex/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/narthex"]

# src layout
[tool.hatch.build.targets.wheel.force-include]
"web" = "narthex/web"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
